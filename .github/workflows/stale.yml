# YML file for marking stale issues and pull requests
name: Mark Stale Issues and Pull Requests

# Triggers that yml fires on
on:
  schedule:
    - cron: "30 8 * * 1"

  workflow_dispatch:

# Permissions
permissions:
  issues: write
  pull-requests: write

# Jobs
jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: "This has been inactive for 60 days. Comment to keep it open."
          stale-pr-message: "This pull request has been inactive for 60 days. Comment to keep it open."

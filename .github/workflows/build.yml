# YML file for building FTC robot
name: Build FTC Robot Controller

# Triggers that yml fires on
on:
  push:
  pull_request:

# Permissions
permissions:
  contents: read

# Job
jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: ./gradlew build
